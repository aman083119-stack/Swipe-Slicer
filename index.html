<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Swipe Slicer — slice same-color combos, dodge bombs, chase high scores. Built for YouTube Playables." />
  <title>Swipe Slicer</title>
  <style>
    :root {
      --bg: #07071a;
      --neon: #ffd700;
      --accent: #ff3b5c;
      --cyan: #00d4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #12123a 0%, #07071a 70%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(12px, env(safe-area-inset-top)) 16px 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      z-index: 5;
    }
    #hud-left { display: flex; flex-direction: column; gap: 2px; }
    #score { font-size: clamp(20px, 5vw, 28px); font-weight: 800; letter-spacing: 0.5px; }
    #combo { font-size: clamp(14px, 3.5vw, 18px); color: var(--neon); font-weight: 700; min-height: 1.2em; }
    #misses { font-size: clamp(13px, 3.2vw, 16px); color: #ff8a9a; letter-spacing: 2px; }
    #hud-right { text-align: right; }
    #best { font-size: clamp(12px, 3vw, 15px); color: #aab; }
    #theme { font-size: clamp(11px, 2.5vw, 13px); color: #778; margin-top: 2px; }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(7, 7, 26, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .screen.visible { display: flex; }
    .screen h1 {
      font-size: clamp(36px, 10vw, 56px);
      font-weight: 900;
      background: linear-gradient(135deg, #ff3b5c, #ffd700, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .screen h2 { font-size: clamp(24px, 6vw, 32px); margin-bottom: 12px; }
    .screen p {
      color: #b0b8d0;
      max-width: 360px;
      line-height: 1.5;
      margin-bottom: 20px;
      font-size: clamp(14px, 3.5vw, 16px);
    }
    .btn {
      pointer-events: auto;
      border: none;
      border-radius: 999px;
      padding: 14px 36px;
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff3b5c, #ff6b8a);
      color: #fff;
      box-shadow: 0 4px 24px rgba(255, 59, 92, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      margin: 6px;
    }
    .btn:hover, .btn:active {
      transform: scale(1.05);
      box-shadow: 0 6px 28px rgba(255, 59, 92, 0.6);
    }
    .stats {
      font-size: clamp(14px, 3.5vw, 16px);
      color: #ccd;
      margin: 8px 0 20px;
    }
    .stats strong { color: var(--neon); }
    #paused-screen h2 { color: var(--cyan); letter-spacing: 4px; }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div id="hud-left">
        <div id="score">0</div>
        <div id="combo"></div>
        <div id="misses">♥♥♥</div>
      </div>
      <div id="hud-right">
        <div id="best">Best 0</div>
        <div id="theme"></div>
      </div>
    </div>

    <div id="start-screen" class="screen visible">
      <h1>SWIPE SLICER</h1>
      <p>Slice same-color chains in one swipe for combo multipliers. Miss 3 or hit a bomb and it’s over.</p>
      <button class="btn" id="play-btn">Play</button>
      <p style="margin-top:24px;font-size:12px;color:#556">Touch / mouse · YouTube Playables ready</p>
    </div>

    <div id="gameover-screen" class="screen">
      <h2>Game Over</h2>
      <div class="stats" id="final-stats"></div>
      <button class="btn" id="retry-btn">Play Again</button>
    </div>

    <div id="paused-screen" class="screen">
      <h2>PAUSED</h2>
      <p>Game will resume when YouTube unpauses</p>
    </div>
  </div>

  <!-- YouTube Playables SDK MUST load before any game code -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <script src="game.js"></script>
</body>
</html>
